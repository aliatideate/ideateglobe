<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideate's Collaborators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Ideate palette */
    --icon:#FFCB3A;
    --dusk:#120029;
    --beam:#FFFFFF;
    --bolt:#3633F8;
    --glow:#FFAEC0;
    --mist:#A8A1E5;
    /* UI tokens */
    --bg:#e8dfc7;
    --win-border:var(--dusk);
    --bar:var(--dusk);
    --bar-text:var(--beam);
    --ink:var(--dusk);
    --btn-face:#ebe6f7;
    --ocean:var(--bolt);
    --shadow-dot:#c9c3e8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; min-height:100%; background:var(--dusk);
    display:flex; align-items:center; justify-content:center;
    font-family:Tahoma, Geneva, "DejaVu Sans", Verdana, sans-serif;
    -webkit-font-smoothing:none;
    padding:0;
    cursor:default;
  }
  .canvas{
    position:relative;
    aspect-ratio:9/16;
    width:min(100vw, 56.25vh);
    max-height:100vh;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    background:var(--dusk) center/cover no-repeat;
    background-image:url('assets/bg.png');
    cursor:default;
  }
  .window{
    position:relative; z-index:3;
    width:660px; max-width:96%;
    flex-shrink:0;
    transform-origin:center center;
    background:var(--bg);
    border:5px solid var(--win-border);
    box-shadow:0 0 0 1px #000, 6px 8px 0 rgba(0,0,0,.28);
    image-rendering:pixelated; image-rendering:crisp-edges;
    display:flex; flex-direction:column;
    user-select:none;
    cursor:default;
  }
  .titlebar{
    background:var(--bar); color:var(--bar-text);
    border-bottom:5px solid var(--win-border);
    display:flex; align-items:center; gap:22px;
    padding:7px 8px 7px 12px;
    font-weight:700; letter-spacing:.5px;
  }
  .title{font-size:17px; white-space:nowrap}
  .winbtns{margin-left:auto; display:flex; gap:7px}
  .winbtn{
    width:22px;height:22px; border:2px solid var(--bar-text);
    display:grid; place-items:center; font-size:12px; line-height:1;
    color:var(--bar-text); cursor:default; background:transparent;
  }
  .winbtn b{transform:translateY(-1px)}
  .stage{position:relative; padding:0; background:var(--bg)}
  canvas#globe{
    display:block; width:100%; height:auto;
    image-rendering:pixelated; image-rendering:crisp-edges; background:var(--bg);
    transform-origin:center center;
    transition:transform .35s steps(5), opacity .35s steps(5);
  }
  .stage.is-exiting #globe{transform:scale(.35); opacity:0}
  .map-cta-wrap{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%, -50%) scale(.92);
    display:flex; flex-direction:column; align-items:center; gap:18px;
    opacity:0; pointer-events:none;
    transition:opacity .14s steps(3), transform .14s steps(3);
    z-index:3;
  }
  .map-cta-wrap.show{
    opacity:1; pointer-events:auto;
    transform:translate(-50%, -50%) scale(1);
  }
  .map-cta{
    background:var(--icon); color:var(--dusk);
    border:2px solid var(--dusk);
    box-shadow:5px 5px 0 var(--bolt);
    font:700 18px/1.2 Tahoma, Geneva, "DejaVu Sans", Verdana, sans-serif;
    padding:17px 26px; white-space:nowrap;
    cursor:pointer;
  }
  .map-cta-url{
    color:var(--dusk);
    font:700 16px/1.2 Tahoma, Geneva, "DejaVu Sans", Verdana, sans-serif;
    text-decoration:none;
  }
  .map-cta-url:hover{text-decoration:underline}
  .scrollbar.is-disabled{opacity:.55; pointer-events:none}
  .tip{
    position:absolute; left:0; top:0; transform:translate(-50%,-100%) scale(.6);
    transform-origin:50% 120%;
    background:var(--beam); color:var(--ink);
    border:2px solid var(--win-border);
    box-shadow:3px 3px 0 rgba(0,0,0,.25);
    padding:8px 12px; font-size:16px; font-weight:700; white-space:nowrap;
    opacity:0; pointer-events:none;
    transition:opacity .14s steps(3), transform .14s steps(3);
  }
  .tip.show{opacity:1; transform:translate(-50%,-100%) scale(1)}
  .tip .sub{display:block; font-weight:400; font-size:14px; color:#4a3d6b; margin-top:2px}
  .tip:after{
    content:""; position:absolute; left:50%; bottom:-8px; width:8px; height:8px;
    margin-left:-4px; background:var(--beam);
    border-right:2px solid var(--win-border); border-bottom:2px solid var(--win-border);
    transform:rotate(45deg);
  }
  .scrollbar{
    display:flex; align-items:stretch; height:40px;
    border-top:5px solid var(--win-border);
    background:var(--bg);
  }
  .arrow{
    width:46px; flex:0 0 46px; background:var(--btn-face);
    border:none; cursor:pointer; display:grid; place-items:center;
    position:relative;
  }
  .arrow.left{border-right:3px solid var(--win-border)}
  .arrow.right{border-left:3px solid var(--win-border)}
  .arrow:active{background:var(--glow)}
  .arrow:disabled{cursor:default; opacity:.45}
  .arrow svg{width:18px;height:18px}
  .arrow .gly{fill:var(--dusk)}
  .track{position:relative; flex:1 1 auto; background:#ddd8f2;
    box-shadow:inset 0 0 0 1px rgba(18,0,41,.12)}
  .thumb{
    position:absolute; top:6px; bottom:6px; width:56px;
    background:var(--dusk); border:2px solid var(--win-border);
    box-shadow:inset 0 2px 0 rgba(168,161,229,.45);
    cursor:pointer; touch-action:none;
  }
  .thumb:active{cursor:pointer}
  .partner-popup{
    position:absolute; left:20px; bottom:20px; width:230px;
    background:var(--partner-surface,#faf8ff);
    border:3px solid var(--win-border);
    box-shadow:4px 4px 0 rgba(0,0,0,.28);
    opacity:0; pointer-events:none;
    transform-origin:0 100%;
    transition:opacity .14s steps(3);
    z-index:2;
  }
  .partner-popup.show{opacity:1; pointer-events:auto}
  .partner-titlebar{
    position:relative; height:30px;
    background:var(--bolt);
    border-bottom:3px solid var(--win-border);
  }
  .partner-close{
    position:absolute; right:5px; top:6px;
    width:15px; height:15px; padding:0;
    background:var(--glow); border:2px solid var(--win-border);
    color:var(--dusk); font-size:9px; line-height:1;
    cursor:pointer; display:grid; place-items:center;
    font-family:inherit; font-weight:700;
  }
  .partner-close:active{background:#ff8faa}
  .partner-body{padding:14px 14px 16px}
  .partner-logo{
    display:flex; align-items:center; justify-content:center;
    min-height:83px; margin-bottom:14px;
    padding:0 10px;
  }
  .partner-logo img{
    display:block; max-width:100%; max-height:92px;
    image-rendering:pixelated; image-rendering:crisp-edges;
  }
  .partner-logo .firm-fallback{
    color:var(--bolt);
    font-family:Georgia,"Times New Roman",serif;
    font-size:20px; font-weight:400; text-align:center;
    line-height:1.15;
  }
  .partner-tags{
    list-style:none; margin:0; padding:0;
    display:flex; flex-direction:column; gap:8px;
  }
  .partner-tags li{
    background:var(--partner-tag-bg,var(--icon));
    border:2px solid var(--bolt);
    box-shadow:3px 3px 0 var(--bolt);
    color:var(--partner-tag-text,var(--dusk));
    font-size:12px; font-weight:700; text-align:center;
    padding:7px 8px; line-height:1.25;
  }
  .canvas.is-autoplay{cursor:none; pointer-events:none}
  .canvas.is-autoplay *{cursor:none !important}
  .demo-cursor{
    position:fixed; left:0; top:0;
    width:48px; height:48px;
    pointer-events:none; z-index:10000;
    opacity:0;
    transition:left .9s cubic-bezier(.33,.01,.18,1),
               top .9s cubic-bezier(.33,.01,.18,1),
               opacity .2s steps(2);
  }
  .demo-cursor.is-pointer{width:44px; height:52px}
  .demo-cursor.is-visible{opacity:1}
  .demo-cursor img{
    display:block; width:100%; height:100%;
    image-rendering:auto;
  }
  .demo-cursor .demo-cursor-pointer{display:none}
  .demo-cursor.is-pointer .demo-cursor-default{display:none}
  .demo-cursor.is-pointer .demo-cursor-pointer{display:block}
  .intro-tagline{
    position:absolute; left:50%; top:calc(6% + 5px);
    width:min(92%, 510px); margin:0;
    transform:translate(-50%, -120%);
    font-family:Manrope, Tahoma, Geneva, "DejaVu Sans", Verdana, sans-serif;
    font-weight:500; font-size:clamp(21px, 5.7vw, 27px); line-height:1.28;
    color:var(--beam); text-align:center;
    opacity:0; pointer-events:none; z-index:4;
  }
  .intro-tagline.is-visible{
    animation:introSlideDown .75s ease forwards;
  }
  .intro-logo{
    position:absolute; left:50%; bottom:9%;
    transform:translate(-50%, 120%);
    opacity:0; pointer-events:none; z-index:4;
  }
  .intro-logo.is-visible{
    animation:introSlideUp .75s ease forwards;
  }
  .intro-logo img{
    display:block; width:min(76vw, 300px); height:auto;
  }
  .folder-launch{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%, -50%);
    z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:0; border:none; background:transparent;
    cursor:pointer;
    image-rendering:pixelated; image-rendering:crisp-edges;
    opacity:0;
  }
  .folder-launch.is-visible{animation:introFadeIn .5s ease forwards}
  .folder-launch img{display:block; width:min(38.5vw, 146px); height:auto}
  .folder-label{
    display:block;
    color:var(--beam);
    font:700 clamp(13px, 3.4vw, 17px)/1.15 Tahoma, Geneva, "DejaVu Sans", Verdana, sans-serif;
    text-align:center; letter-spacing:.35px;
    max-width:min(43vw, 165px);
    text-shadow:
      1px 0 0 var(--dusk), -1px 0 0 var(--dusk),
      0 1px 0 var(--dusk), 0 -1px 0 var(--dusk),
      2px 2px 0 var(--bolt);
  }
  .folder-launch.is-opening{
    opacity:0;
    transform:translate(-50%, -50%) scale(1.08);
    pointer-events:none;
  }
  .folder-launch[hidden]{display:none}
  .window[hidden]{display:none}
  .window.is-opening{animation:windowPop .52s steps(8) both}
  @keyframes windowPop{
    0%{opacity:0; transform:scale(.62)}
    45%{opacity:1; transform:scale(.95)}
    100%{opacity:1; transform:scale(1)}
  }
  @keyframes introSlideDown{
    from{opacity:0; transform:translate(-50%, -120%)}
    to{opacity:1; transform:translate(-50%, 0)}
  }
  @keyframes introSlideUp{
    from{opacity:0; transform:translate(-50%, 120%)}
    to{opacity:1; transform:translate(-50%, 0)}
  }
  @keyframes introFadeIn{
    from{opacity:0}
    to{opacity:1}
  }
  @media (prefers-reduced-motion:reduce){
    .tip,.partner-popup,.folder-launch,.map-cta-wrap,.demo-cursor,.intro-tagline,.intro-logo{transition:none}
    .intro-tagline.is-visible,.intro-logo.is-visible,.folder-launch.is-visible{animation:none; opacity:1}
    .intro-tagline.is-visible{transform:translate(-50%, 0)}
    .intro-logo.is-visible{transform:translate(-50%, 0)}
    .folder-launch.is-visible{transform:translate(-50%, -50%)}
    .window.is-opening{animation:none}
    canvas#globe{transition:none}
  }
</style>

<div class="canvas" id="canvas">
  <p class="intro-tagline" id="introTagline" hidden>Some of the world's best<br>design firms work with us.</p>
  <button class="folder-launch" id="folderLaunch" type="button" aria-label="Open Ideate's Collaborators" hidden>
    <img src="assets/collaborators-folder-icon.png" alt="" width="146" height="117" decoding="async">
    <span class="folder-label">Ideate's<br>Collaborators</span>
  </button>
  <div class="intro-logo" id="introLogo" hidden>
    <img src="assets/Ideate-logo.svg" alt="Ideate Innovation" width="300" height="34" decoding="async">
  </div>
<div class="window" id="appWindow" role="application" aria-label="Ideate's Collaborators globe explorer" hidden aria-hidden="true">
  <div class="titlebar">
    <div class="title">Ideate's&nbsp;Collaborators</div>
    <div class="winbtns">
      <div class="winbtn" title="Minimize"><b>_</b></div>
      <div class="winbtn" title="Maximize"><b>□</b></div>
      <div class="winbtn" title="Close"><b>✕</b></div>
    </div>
  </div>

  <div class="stage">
    <canvas id="globe" width="660" height="600"></canvas>
    <div class="tip" id="tip"><span id="tipCity">New York City</span><span class="sub" id="tipCountry">United States</span></div>
    <div class="partner-popup" id="partnerPopup" hidden>
      <div class="partner-titlebar">
        <button type="button" class="partner-close" id="partnerClose" aria-label="Close">✕</button>
      </div>
      <div class="partner-body">
        <div class="partner-logo" id="partnerLogo"></div>
        <ul class="partner-tags" id="partnerTags"></ul>
      </div>
    </div>
    <div class="map-cta-wrap" id="mapCtaWrap" hidden>
      <button class="map-cta" id="mapCta" type="button">There's room for one more →</button>
      <a class="map-cta-url" href="https://www.ideateinnovation.com" target="_blank" rel="noopener noreferrer">www.ideateinnovation.com</a>
    </div>
  </div>

  <div class="scrollbar" id="scrollbar">
    <button class="arrow left" id="prev" aria-label="Previous location">
      <svg viewBox="0 0 18 18"><polygon class="gly" points="12,2 12,16 4,9"/></svg>
    </button>
    <div class="track" id="track">
      <div class="thumb" id="thumb"></div>
    </div>
    <button class="arrow right" id="next" aria-label="Next location">
      <svg viewBox="0 0 18 18"><polygon class="gly" points="6,2 6,16 14,9"/></svg>
    </button>
  </div>
</div>
</div>

<div class="demo-cursor" id="demoCursor" hidden aria-hidden="true">
  <img class="demo-cursor-default" src="assets/cursor-default.png?v=2" alt="" width="48" height="48">
  <img class="demo-cursor-pointer" src="assets/cursor-pointer.png?v=2" alt="" width="44" height="52">
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
(async function(){
  "use strict";

  const CITIES = [
    {
      name:'New York City', country:'United States', lon:-74.00, lat:40.71,
      partner:{
        firm:'IDEO',
        logoFile:'IDEO.png',
        logoAlt:'IDEO logo',
        tags:['Illustration','UX Design','User Research','Presentation Design'],
        tagBg:'#FFCB3A', accent:'#3633F8'
      }
    },
    {
      name:'Dakar', country:'Senegal', lon:-17.45, lat:14.69,
      partner:{
        firm:'Yux Design',
        logoFile:'Yux Design.png',
        logoAlt:'Yux Design logo',
        tags:['User Research','Remote Workshops','UX Design'],
        tagBg:'#FFCB3A', accent:'#3633F8'
      }
    },
    {
      name:'Amsterdam', country:'Netherlands', lon:4.90, lat:52.37,
      partner:{
        firm:'Bopinc',
        logoFile:'Bopinc.png',
        logoAlt:'Bopinc logo',
        tags:['Market Research','Brand Design','Stakeholder Workshops','Prototyping & Testing'],
        tagBg:'#FFCB3A', accent:'#3633F8'
      }
    },
    {
      name:'Dubai', country:'United Arab Emirates', lon:55.27, lat:25.20,
      partner:{
        firm:'sweetwater.',
        logoFile:'Sweetwater.png',
        logoAlt:'Sweetwater logo',
        tags:['Market Research','GTM Strategy','Persona Workshops','Prototyping & Testing'],
        tagBg:'#FFCB3A', accent:'#3633F8'
      }
    },
  ];
  const N = CITIES.length;
  const STOPS = N + 1;
  const LAST_CITY_IDX = N - 1;
  const FINALE_IDX = STOPS - 1;
  const START_IDX = 0;
  const REVEAL_DELAY_MS = 200;
  const FINALE_EXIT_MS = 350;
  const POPUP_INSET = 20;
  const FOLDER_APPEAR_DELAY_MS = 2000;
  const AUTO_FOLDER_WAIT_MS = 2000;
  const AUTO_CITY_DWELL_MS = 4000;
  const AUTO_FIRST_CITY_DELAY_MS = 1000;
  const AUTO_CTA_HOLD_MS = 3000;
  const AUTO_CURSOR_MOVE_MS = 900;
  const AUTO_WINDOW_OPEN_MS = 520;
  const autoplay = !new URLSearchParams(location.search).has('manual');
  let appLaunched = false;
  let finalePhase = 'explore';
  let autoplayActive = false;

  const folderLaunch = document.getElementById('folderLaunch');
  const folderImg = folderLaunch.querySelector('img');
  const introTagline = document.getElementById('introTagline');
  const introLogo = document.getElementById('introLogo');
  const appWindow = document.getElementById('appWindow');
  const mapCtaWrap = document.getElementById('mapCtaWrap');
  const mapCta = document.getElementById('mapCta');
  const scrollbarEl = document.getElementById('scrollbar');
  const canvasEl = document.getElementById('canvas');
  const demoCursor = document.getElementById('demoCursor');

  function partnerLogoSrc(partner){
    const file=partner.logoFile || (partner.firm + '.png');
    return encodeURI('assets/partners/' + file);
  }

  const logoCache=CITIES.map(()=>({ok:false, img:null}));

  function preloadPartnerLogos(){
    return Promise.all(CITIES.map((city,i)=>new Promise(resolve=>{
      const partner=city.partner;
      const img=new Image();
      img.alt=partner.logoAlt || partner.firm;
      img.onload=()=>{ logoCache[i]={ok:true, img}; resolve(); };
      img.onerror=()=>{ logoCache[i]={ok:false, img:null}; resolve(); };
      img.src=partnerLogoSrc(partner);
    })));
  }

  function waitForImage(img){
    return new Promise(resolve=>{
      if(img.complete && img.naturalWidth>0) resolve();
      else{
        img.addEventListener('load', resolve, {once:true});
        img.addEventListener('error', resolve, {once:true});
      }
    });
  }

  const folderImgReady = waitForImage(folderImg);

  const topo = await (async()=>{
    const [data]=await Promise.all([
      fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(r=>r.json()),
      preloadPartnerLogos(),
      folderImgReady,
    ]);
    return data;
  })();
  const land    = topojson.feature(topo, topo.objects.countries);
  const borders = topojson.mesh(topo, topo.objects.countries, (a,b)=>a!==b);

  const COL = {
    ocean:'#3633F8', oceanLt:'#A8A1E5', oceanEdge:'#2a28c4',
    land:'#FFCB3A',  landEdge:'#e0b832', border:'#120029',
    grat:'rgba(168,161,229,0.65)',
    markFill:'#FFCB3A', markEdge:'#120029',
    shadow:'#c9c3e8'
  };

  const main = document.getElementById('globe');
  const mctx = main.getContext('2d');
  const W = main.width, H = main.height;
  const R = 140;
  const GLOBE = 560;
  const GX = (W-GLOBE)/2, GY = 8;
  const CX = GX+GLOBE/2, CY = GY+GLOBE/2;
  const TRACK_INSET = 12;

  const buf = document.createElement('canvas'); buf.width=R; buf.height=R;
  const bctx = buf.getContext('2d');
  const proj = d3.geoOrthographic().translate([R/2,R/2]).scale(R/2-3).clipAngle(90);
  const path = d3.geoPath(proj, bctx);
  const graticule = d3.geoGraticule().step([20,20])();

  const pat = document.createElement('canvas'); pat.width=2; pat.height=2;
  const pctx = pat.getContext('2d');
  pctx.fillStyle=COL.oceanLt; pctx.fillRect(0,0,1,1); pctx.fillRect(1,1,1,1);
  const oceanPattern = bctx.createPattern(pat,'repeat');

  function rotForPos(p){
    const cityPos = Math.min(p, N - 1);
    const i = Math.max(0, Math.min(N-2, Math.floor(cityPos)));
    const f = Math.max(0, Math.min(1, cityPos - i));
    const a = CITIES[i], b = CITIES[i+1];
    return [ -(a.lon+(b.lon-a.lon)*f), -(a.lat+(b.lat-a.lat)*f), 0 ];
  }

  function cityIdxFromPos(p){
    return Math.min(Math.round(p), N - 1);
  }

  function drawBuffer(rot){
    bctx.clearRect(0,0,R,R);
    bctx.imageSmoothingEnabled=false;
    proj.rotate(rot);

    bctx.beginPath(); path({type:'Sphere'}); bctx.fillStyle=COL.ocean; bctx.fill();
    bctx.save(); bctx.beginPath(); path({type:'Sphere'}); bctx.clip();
    bctx.fillStyle=oceanPattern; bctx.fillRect(0,0,R,R); bctx.restore();
    bctx.beginPath(); path(graticule); bctx.strokeStyle=COL.grat; bctx.lineWidth=1; bctx.stroke();
    bctx.beginPath(); path(land); bctx.fillStyle=COL.land; bctx.fill();
    bctx.beginPath(); path(borders); bctx.strokeStyle=COL.border; bctx.lineWidth=1; bctx.stroke();
    bctx.beginPath(); path(land);    bctx.strokeStyle=COL.landEdge; bctx.lineWidth=1; bctx.stroke();
    const g = bctx.createRadialGradient(R/2,R/2,R*0.30, R/2,R/2,R/2-3);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(0.92,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(8,18,38,0.42)');
    bctx.beginPath(); path({type:'Sphere'}); bctx.fillStyle=g; bctx.fill();
  }

  function drawMarker(){
    const tri = 44;
    const cx = Math.round(CX);
    const cy = Math.round(CY);
    const bx = cx - Math.round(0.667 * tri);
    const by = cy - Math.round(0.333 * tri);
    const trace = () => {
      mctx.beginPath();
      mctx.moveTo(bx, by);
      mctx.lineTo(bx + tri, by);
      mctx.lineTo(bx + tri, by + tri);
      mctx.closePath();
    };
    trace();
    mctx.fillStyle = COL.markFill;
    mctx.fill();
    mctx.lineWidth = 2;
    mctx.lineJoin = 'miter';
    mctx.strokeStyle = COL.markEdge;
    trace();
    mctx.stroke();
  }

  function drawShadow(){
    const sy=GY+GLOBE+14, rx=GLOBE*0.34, ry=15, step=4;
    for(let yy=-ry; yy<=ry; yy+=step){
      for(let xx=-rx; xx<=rx; xx+=step){
        const d=(xx*xx)/(rx*rx)+(yy*yy)/(ry*ry);
        if(d>1) continue;
        const keep = (1-d);
        if(((xx/step + yy/step) & 1) === 0 && Math.random() < keep*1.1){
          mctx.fillStyle = COL.shadow;
          mctx.globalAlpha = 0.55*keep+0.1;
          mctx.fillRect(CX+xx, sy+yy, 2, 2);
        }
      }
    }
    mctx.globalAlpha=1;
  }

  function render(pos, settled, showMarker){
    drawBuffer(rotForPos(pos));
    mctx.clearRect(0,0,W,H);
    drawShadow();
    mctx.imageSmoothingEnabled=false;
    mctx.drawImage(buf, 0,0,R,R, GX,GY,GLOBE,GLOBE);
    if(settled && showMarker) drawMarker();
  }

  const tip=document.getElementById('tip');
  const tipCity=document.getElementById('tipCity');
  const tipCountry=document.getElementById('tipCountry');
  const stageEl=document.querySelector('.stage');
  function placeTip(show, idx){
    if(show){
      const c=CITIES[idx]; tipCity.textContent=c.name; tipCountry.textContent=c.country;
      const sx = stageEl.clientWidth/ W;
      tip.style.left = (CX*sx) + 'px';
      tip.style.top  = ((CY - 32)*sx) + 'px';
      tip.classList.add('show');
    } else {
      tip.classList.remove('show');
    }
  }

  const partnerPopup=document.getElementById('partnerPopup');
  const partnerLogo=document.getElementById('partnerLogo');
  const partnerTags=document.getElementById('partnerTags');
  const partnerClose=document.getElementById('partnerClose');
  let partnerDismissed=false, lastPartnerIdx=0, renderedPartnerIdx=-1;
  let settledSince=0, lastSettledIdx=-1, revealTimer=null;
  let initialRevealPending=true;

  function showFirmFallback(partner){
    partnerLogo.innerHTML = '<span class="firm-fallback">' + partner.firm + '</span>';
  }

  function renderPartner(idx){
    if(idx===renderedPartnerIdx) return;
    renderedPartnerIdx=idx;
    const partner=CITIES[idx].partner;
    partnerPopup.style.setProperty('--partner-tag-bg', partner.tagBg || '#FFCB3A');
    partnerPopup.style.setProperty('--partner-accent', partner.accent || '#3633F8');
    partnerTags.innerHTML='';
    partner.tags.forEach(tag=>{
      const li=document.createElement('li');
      li.textContent=tag;
      partnerTags.appendChild(li);
    });
    const cached=logoCache[idx];
    if(cached.ok && cached.img){
      partnerLogo.innerHTML='';
      partnerLogo.appendChild(cached.img.cloneNode());
    } else {
      showFirmFallback(partner);
    }
  }

  function placePartner(show, idx){
    const sx=stageEl.clientWidth/W;
    partnerPopup.style.left=(POPUP_INSET*sx)+'px';
    partnerPopup.style.bottom=(POPUP_INSET*sx)+'px';
    partnerPopup.style.top='auto';
    partnerPopup.style.transform='scale('+sx+')';
    if(show){
      partnerPopup.hidden=false;
      renderPartner(idx);
      partnerPopup.classList.add('show');
    } else {
      partnerPopup.classList.remove('show');
      partnerPopup.hidden=true;
    }
  }

  function revealDelayMs(idx){
    if(reduce) return 0;
    if(idx===START_IDX && initialRevealPending) return REVEAL_DELAY_MS;
    return 0;
  }

  function revealReady(){
    if(!settledNow()) return false;
    const idx=cityIdxFromPos(pos);
    const delay=revealDelayMs(idx);
    if(delay===0) return true;
    return Date.now()-settledSince>=delay;
  }

  function shouldShowCityUi(){
    if(finalePhase !== 'explore') return false;
    const stop=Math.round(pos);
    if(stop>=FINALE_IDX) return false;
    return settledNow() && revealReady();
  }

  function shouldShowMarker(){
    if(finalePhase==='exit' || finalePhase==='cta') return false;
    if(!settledNow()) return false;
    if(Math.round(pos)>=FINALE_IDX) return false;
    return revealReady();
  }

  function disableScrollbar(){
    scrollbarEl.classList.add('is-disabled');
    prev.disabled=true;
    next.disabled=true;
  }

  let finaleTimer=null;
  function startFinale(){
    if(finalePhase !== 'explore') return;
    finalePhase='exit';
    placeTip(false, LAST_CITY_IDX);
    placePartner(false, LAST_CITY_IDX);
    stageEl.classList.add('is-exiting');
    clearTimeout(finaleTimer);
    const exitMs=reduce ? 0 : FINALE_EXIT_MS;
    finaleTimer=setTimeout(()=>{
      finalePhase='cta';
      stageEl.classList.remove('is-exiting');
      main.style.visibility='hidden';
      mapCtaWrap.hidden=false;
      mapCtaWrap.classList.add('show');
      disableScrollbar();
      updateArrows();
    }, exitMs);
  }

  function scheduleReveal(){
    clearTimeout(revealTimer);
    if(!settledNow()) return;
    const idx=cityIdxFromPos(pos);
    const delay=revealDelayMs(idx);
    if(delay===0){
      if(idx===START_IDX) initialRevealPending=false;
      frame();
      return;
    }
    const remaining=Math.max(0, delay-(Date.now()-settledSince));
    revealTimer=setTimeout(()=>{
      if(cityIdxFromPos(pos)===START_IDX) initialRevealPending=false;
      frame();
    }, remaining);
  }

  function trackSettlement(){
    if(settledNow()){
      const stop=Math.round(pos);
      if(stop!==lastSettledIdx){
        settledSince=Date.now();
        lastSettledIdx=stop;
        if(stop===FINALE_IDX && finalePhase==='explore'){
          startFinale();
        } else {
          scheduleReveal();
        }
      }
    } else if(lastSettledIdx!==-1){
      lastSettledIdx=-1;
      clearTimeout(revealTimer);
    }
  }

  function updatePartnerPopup(){
    const idx=cityIdxFromPos(pos);
    if(idx!==lastPartnerIdx){
      partnerDismissed=false;
      lastPartnerIdx=idx;
      renderedPartnerIdx=-1;
    }
    if(shouldShowCityUi() && !partnerDismissed){
      placePartner(true, idx);
    } else if(finalePhase==='explore'){
      placePartner(false, idx);
    }
  }

  partnerClose.addEventListener('click',()=>{
    if(finalePhase !== 'explore') return;
    partnerDismissed=true;
    placePartner(false, cityIdxFromPos(pos));
  });

  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  let pos=0, target=0, dragging=false, animating=false, fromPos=0, t0=0, dur=0;
  const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;

  function settledNow(){ return !dragging && !animating && Math.abs(pos-Math.round(pos))<1e-6; }

  function frame(){
    if(!appLaunched) return;
    if(finalePhase==='cta') return;
    const s=settledNow();
    trackSettlement();
    if(finalePhase==='exit') return;
    const cityIdx=cityIdxFromPos(pos);
    const showUi=shouldShowCityUi();
    const showMarker=shouldShowMarker();
    render(pos, s, showMarker);
    placeTip(showUi, cityIdx);
    updatePartnerPopup();
    placeThumb(pos);
    updateArrows();
  }

  function openApp(){
    if(appLaunched) return;
    appLaunched = true;
    const animMs = reduce ? 0 : 520;
    folderLaunch.classList.add('is-opening');
    appWindow.hidden = false;
    appWindow.setAttribute('aria-hidden', 'false');
    appWindow.classList.add('is-opening');
    setTimeout(()=>{
      folderLaunch.hidden = true;
      appWindow.classList.remove('is-opening');
    }, animMs);
    settledSince = Date.now();
    lastSettledIdx = -1;
    frame();
  }

  function animateTo(idx){
    if(!appLaunched || finalePhase==='cta' || finalePhase==='exit') return;
    idx=Math.max(0,Math.min(FINALE_IDX,idx));
    clearTimeout(revealTimer);
    if(reduce){ pos=target=idx; animating=false; frame(); return; }
    fromPos=pos; target=idx; t0=performance.now();
    dur=Math.max(240, Math.abs(target-fromPos)*620);
    animating=true; requestAnimationFrame(tick);
  }
  function tick(now){
    if(dragging){ animating=false; return; }
    let t=(now-t0)/dur; if(t>=1)t=1;
    pos=fromPos+(target-fromPos)*ease(t);
    const cityIdx=cityIdxFromPos(pos);
    render(pos,false,false);
    placeThumb(pos); placeTip(false); placePartner(false, cityIdx);
    if(t<1){ requestAnimationFrame(tick); }
    else { animating=false; pos=target; frame(); }
  }

  const track=document.getElementById('track');
  const thumb=document.getElementById('thumb');
  const prev=document.getElementById('prev');
  const next=document.getElementById('next');

  function trackGeom(){
    const tr=track.getBoundingClientRect();
    const tw=thumb.offsetWidth;
    const travel = Math.max(0, tr.width - tw - TRACK_INSET * 2);
    return {left:tr.left, width:tr.width, tw, travel};
  }
  function placeThumb(p){
    const {travel}=trackGeom();
    const x=TRACK_INSET + (p/(STOPS-1))*travel;
    thumb.style.left=x+'px';
  }
  function updateArrows(){
    if(finalePhase==='cta' || finalePhase==='exit'){
      prev.disabled=true;
      next.disabled=true;
      return;
    }
    const i=Math.round(pos);
    prev.disabled = (!animating && i<=0 && pos<=0.0001);
    next.disabled = (!animating && i>=FINALE_IDX && pos>=FINALE_IDX-0.0001);
  }

  prev.addEventListener('click',()=>{ if(autoplayActive)return; if(prev.disabled)return; animateTo(Math.round(animating?target:pos)-1); });
  next.addEventListener('click',()=>{ if(autoplayActive)return; if(next.disabled)return; animateTo(Math.round(animating?target:pos)+1); });

  thumb.addEventListener('pointerdown',e=>{
    if(autoplayActive) return;
    if(finalePhase!=='explore') return;
    dragging=true; animating=false;
    clearTimeout(revealTimer);
    placePartner(false, cityIdxFromPos(pos));
    thumb.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  thumb.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const {left,travel,tw}=trackGeom();
    let x=e.clientX-left-tw/2;
    let p=((x-TRACK_INSET)/travel)*(STOPS-1);
    pos=Math.max(0,Math.min(FINALE_IDX,p));
    render(pos,false,false); placeThumb(pos); placeTip(false); placePartner(false, cityIdxFromPos(pos)); updateArrows();
  });
  function endDrag(e){
    if(!dragging)return; dragging=false;
    try{thumb.releasePointerCapture(e.pointerId);}catch(_){}
    animateTo(Math.round(pos));
  }
  thumb.addEventListener('pointerup',endDrag);
  thumb.addEventListener('pointercancel',endDrag);

  track.addEventListener('pointerdown',e=>{
    if(autoplayActive) return;
    if(finalePhase!=='explore' || e.target===thumb)return;
    const {left,travel,tw}=trackGeom();
    let p=((e.clientX-left-tw/2-TRACK_INSET)/travel)*(STOPS-1);
    animateTo(Math.round(Math.max(0,Math.min(FINALE_IDX,p))));
  });

  window.addEventListener('keydown',e=>{
    if(autoplayActive) return;
    if(!appLaunched){
      if(e.target===folderLaunch && (e.key==='Enter' || e.key===' ')){
        e.preventDefault();
        openApp();
      }
      return;
    }
    if(e.key==='ArrowRight'){ if(!next.disabled)next.click(); }
    if(e.key==='ArrowLeft'){ if(!prev.disabled)prev.click(); }
  });

  window.addEventListener('resize',()=>{
    if(!appLaunched) return;
    placeThumb(pos);
    if(settledNow() && finalePhase==='explore'){
      const idx=cityIdxFromPos(pos);
      placeTip(shouldShowCityUi(), idx);
      updatePartnerPopup();
    }
  });

  folderLaunch.addEventListener('click', ()=>{ if(autoplayActive) return; openApp(); });
  folderLaunch.addEventListener('keydown', e=>{
    if(autoplayActive) return;
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openApp(); }
  });

  function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

  async function waitUntil(fn, interval=50){
    while(!fn()) await sleep(interval);
  }

  function centerOf(el){
    const r=el.getBoundingClientRect();
    return {x:r.left+r.width/2, y:r.top+r.height/2};
  }

  function cursorHotspot(pointer){
    return pointer ? {x:17, y:1} : {x:0, y:0};
  }

  function cursorMoveMs(){
    return reduce ? 0 : AUTO_CURSOR_MOVE_MS;
  }

  async function placeCursor(x, y, animate=true, pointer=false){
    const ms=animate ? cursorMoveMs() : 0;
    const hot=cursorHotspot(pointer);
    demoCursor.classList.toggle('is-pointer', pointer);
    demoCursor.style.transitionDuration=ms ? `${ms}ms, ${ms}ms, 0ms` : '0ms';
    demoCursor.style.left=(x-hot.x)+'px';
    demoCursor.style.top=(y-hot.y)+'px';
    if(ms) await sleep(ms);
  }

  async function moveCursorTo(el, {from=null, pointer=true}={}){
    const {x, y}=centerOf(el);
    if(from){
      await placeCursor(from.x, from.y, false, false);
      demoCursor.hidden=false;
      demoCursor.classList.add('is-visible');
    }
    await placeCursor(x, y, true, pointer);
  }

  async function demoClick(el, action, from=null){
    await moveCursorTo(el, {from, pointer:true});
    await sleep(reduce ? 0 : 100);
    action();
  }

  async function waitForCityStop(stop){
    await waitUntil(()=> settledNow() && Math.round(pos)===stop && shouldShowCityUi());
  }

  async function runAutoplay(){
    if(!autoplay || autoplayActive) return;
    autoplayActive=true;
    canvasEl.classList.add('is-autoplay');
    demoCursor.hidden=false;

    await waitUntil(()=> folderLaunch.classList.contains('is-visible'));
    await sleep(AUTO_FOLDER_WAIT_MS);

    const folderCenter=centerOf(folderLaunch);
    const entryFrom={x:window.innerWidth+48, y:folderCenter.y};
    await demoClick(folderLaunch, openApp, entryFrom);
    await sleep(reduce ? 0 : AUTO_WINDOW_OPEN_MS);

    for(let stop=0; stop<=LAST_CITY_IDX; stop++){
      await waitForCityStop(stop);
      if(stop===START_IDX){
        await sleep(AUTO_FIRST_CITY_DELAY_MS);
        await moveCursorTo(next);
        const holdMs=Math.max(0, AUTO_CITY_DWELL_MS-AUTO_FIRST_CITY_DELAY_MS-cursorMoveMs());
        await sleep(holdMs);
        await sleep(reduce ? 0 : 100);
        animateTo(Math.round(pos)+1);
      } else {
        await sleep(AUTO_CITY_DWELL_MS);
        await demoClick(next, ()=> animateTo(Math.round(pos)+1));
      }
      await waitUntil(()=> settledNow());
    }

    await waitUntil(()=> finalePhase==='cta' && mapCtaWrap.classList.contains('show'));
    await moveCursorTo(mapCta);
    await sleep(AUTO_CTA_HOLD_MS);
  }

  function revealIntroChrome(){
    folderLaunch.hidden = false;
    introTagline.hidden = false;
    introLogo.hidden = false;
    if(reduce){
      folderLaunch.classList.add('is-visible');
      introTagline.classList.add('is-visible');
      introLogo.classList.add('is-visible');
      return;
    }
    void introTagline.offsetHeight;
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        folderLaunch.classList.add('is-visible');
        introTagline.classList.add('is-visible');
        introLogo.classList.add('is-visible');
      });
    });
  }

  async function revealIntro(){
    const maxW = Math.min(window.innerWidth * 0.385, 146);
    const ratio = folderImg.naturalHeight / folderImg.naturalWidth;
    folderImg.style.width = maxW + 'px';
    folderImg.style.height = Math.round(maxW * ratio) + 'px';
    await sleep(FOLDER_APPEAR_DELAY_MS);
    revealIntroChrome();
    if(autoplay) runAutoplay();
  }
  revealIntro();
})();
</script>
